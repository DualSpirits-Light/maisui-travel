name = "maisui-license"
main = "src/index.js"
compatibility_date = "2026-08-01"
account_id = "84a010bcceae67cd238416872ecdc072"
workers_dev = false
routes = [{ pattern = "license.zjm0929.cn", custom_domain = true }]

[vars]
UPDATE_VERSION_CODE = "11"
UPDATE_VERSION_NAME = "0.5.0"
UPDATE_GITHUB_APK_URL = "https://github.com/DualSpirits-Light/maisui-travel/releases/download/v0.5.0/maisui-travel-0.5.0.apk"
UPDATE_APK_SHA256 = "c407d7c8b3e56c8ddc0e7d2c4b60417fcfb06b462512a0fbc12397ca4f4c0316"
UPDATE_NOTES = "新增主题配色与圆角窗口；完善地点详情、标签筛选、旅行打卡与照片编辑；优化 WebDAV、定位与统一管理后台；支持双线路下载、进度与通知。"

DEFAULT_LEASE_DAYS = "7"
DEFAULT_MAX_DEVICES = "1"
PUBLIC_RATE_LIMIT_PER_MINUTE = "30"
ADMIN_RATE_LIMIT_PER_MINUTE = "60"

[[d1_databases]]
binding = "DB"
database_name = "maisui-license"
database_id = "84fc1616-599f-46fa-b86c-db944817f4ee"
migrations_dir = "migrations"

[secrets]
required = ["CODE_PEPPER", "SIGNING_PRIVATE_KEY_PKCS8"]

[[r2_buckets]]
binding = "SHARES"
bucket_name = "maisui-shares"

[[r2_buckets]]
binding = "UPDATES"
bucket_name = "maisui-updates"

[triggers]
crons = ["* * * * *"]

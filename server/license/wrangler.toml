name = "maisui-license"
main = "src/index.js"
compatibility_date = "2026-08-01"
account_id = "84a010bcceae67cd238416872ecdc072"
workers_dev = false
routes = [{ pattern = "license.zjm0929.cn", custom_domain = true }]

[vars]
UPDATE_VERSION_CODE = "10"
UPDATE_VERSION_NAME = "0.4.0"
UPDATE_APK_URL = "https://github.com/DualSpirits-Light/maisui-travel/releases/download/v0.4.0/maisui-travel-0.4.0.apk"
UPDATE_APK_SHA256 = "7f235d3b45006487a0e777d4f15920820998da429753b3ed16351a9e3e1e5e3f"
UPDATE_NOTES = "新增两套可编辑标签预设及标签组、组合搜索、那年今日、AI 搜索与规划；独立关于页、赞赏图片和更新记录；高级设置支持多地图与多个 AI 服务配置，密钥加密并验证后保存；优化旅行导入、备份和更新提示。"

DEFAULT_LEASE_DAYS = "7"
DEFAULT_MAX_DEVICES = "1"
PUBLIC_RATE_LIMIT_PER_MINUTE = "30"
ADMIN_RATE_LIMIT_PER_MINUTE = "60"

[[d1_databases]]
binding = "DB"
database_name = "maisui-license"
database_id = "84fc1616-599f-46fa-b86c-db944817f4ee"
migrations_dir = "migrations"

[secrets]
required = ["ADMIN_TOKEN", "CODE_PEPPER", "SIGNING_PRIVATE_KEY_PKCS8"]

[[r2_buckets]]
binding = "SHARES"
bucket_name = "maisui-shares"

[triggers]
crons = ["* * * * *"]

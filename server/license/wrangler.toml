name = "maisui-license"
main = "src/index.js"
compatibility_date = "2026-08-01"
account_id = "84a010bcceae67cd238416872ecdc072"
workers_dev = false
routes = [{ pattern = "license.zjm0929.cn", custom_domain = true }]

[vars]
UPDATE_VERSION_CODE = "15"
UPDATE_VERSION_NAME = "0.6.0"
UPDATE_GITHUB_APK_URL = "https://github.com/DualSpirits-Light/maisui-travel/releases/download/v0.6.0/maisui-travel-0.6.0.apk"
UPDATE_APK_SHA256 = "762a2fb3f6b2ba8103b625dcd36f4cf50760c4b1eb0eff15d46a334ea04f99c2"
UPDATE_NOTES = "新增美团旅行查询与服务端凭据保护；优化出行速览、日程预览、城市与地点录入、地图热力、AA 账本、回忆照片和深色界面；正式包加入代码混淆。"

DEFAULT_LEASE_DAYS = "7"
DEFAULT_MAX_DEVICES = "1"
PUBLIC_RATE_LIMIT_PER_MINUTE = "30"
ADMIN_RATE_LIMIT_PER_MINUTE = "60"

[[d1_databases]]
binding = "DB"
database_name = "maisui-license"
database_id = "84fc1616-599f-46fa-b86c-db944817f4ee"
migrations_dir = "migrations"

[secrets]
required = ["CODE_PEPPER", "SIGNING_PRIVATE_KEY_PKCS8"]

[[r2_buckets]]
binding = "SHARES"
bucket_name = "maisui-shares"

[[r2_buckets]]
binding = "UPDATES"
bucket_name = "maisui-updates"

[triggers]
crons = ["* * * * *"]

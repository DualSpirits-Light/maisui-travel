plugins { id 'com.android.application' }
def amapVersion = '11.2.100_loc11.2.100_sea9.8.1'
configurations { amapDistribution }
dependencies { amapDistribution "com.amap.api:3dmap-location-search:${amapVersion}" }
def unpackAmap = tasks.register('unpackAmap', Sync) {
    from { configurations.amapDistribution.collect { zipTree(it) } }
    include 'assets/**', 'lib/**'
    into layout.buildDirectory.dir('amap/distribution')
}
def amapClasses = tasks.register('amapClasses', Jar) {
    from { configurations.amapDistribution.collect { zipTree(it) } }
    include '**/*.class'
    archiveFileName = 'amap-classes.jar'
    destinationDirectory = layout.buildDirectory.dir('amap')
}
dependencies { implementation files(amapClasses) }
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
dependencies { implementation 'com.baidu.lbsyun:BaiduMapSDK_Map:8.2.0' }
dependencies { implementation 'com.baidu.lbsyun:BaiduMapSDK_Util:8.2.0' }
dependencies { implementation 'com.baidu.lbsyun:common:1.0.43' }
android {
    namespace 'cn.lvxu.travel'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.lvxu.travel'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.6.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('amap/distribution/assets')
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('amap/distribution/lib')
    packaging { jniLibs { useLegacyPackaging = true } }
}
tasks.named('preBuild').configure { dependsOn unpackAmap, amapClasses }
